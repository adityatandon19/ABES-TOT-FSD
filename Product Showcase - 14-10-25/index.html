<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Product Showcase</title>
     <link rel="stylesheet" href="style.css">
     <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
     <header>My Online Store</header>
     <section class="products">
          <article class="card">
               <img src="img1.png" alt="Product 1">
               <h2>Smartphone</h2>
               <p class="price">&#8377; 4,999</p>
          </article>
          
          <article class="card">
               <img src="img2.png" alt="Product 2">
               <h2>Smartwatch</h2>
               <p class="price">&#8377; 2,999</p>
          </article>

          <article class="card">
               <img src="img3.png" alt="Product 3">
               <h2>Wireless Headphones</h2>
               <p class="price">&#8377; 1,499</p>
          </article>

          <article class="card">
              <img src="img4.png" alt="Product 4">
               <h2>Laptop</h2>
               <p class="price">&#8377; 23,999</p>
          </article>

          <article class="card">
              <img src="img5.png" alt="Product 5">
               <h2>Tablet PCs</h2>
               <p class="price">&#8377; 45,999</p>
          </article>

          <article class="card">
              <img src="img6.png" alt="Product 6">
               <h2>WiFi Routers</h2>
               <p class="price">&#8377; 1,499</p>
          </article>
     </section>

     <footer>
          <p>&copy; 2025 My Online Store</p>
     </footer>
</body>
</html>
