<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration Form</title>
</head>
<body>
  <h2 align="center">Student Registration Form</h2>
  <form>
    <table border="1" cellpadding="6" cellspacing="0" align="center">
      <tr>
        <td>Full Name:</td>
        <td><input type="text" name="fullname" required></td>
      </tr>
      <tr>
        <td>Email:</td>
        <td><input type="email" name="email" required></td>
      </tr>
      <tr>
        <td>Password:</td>
        <td><input type="password" name="password" required></td>
      </tr>
      <tr>
        <td>Confirm Password:</td>
        <td><input type="password" name="confirm" required></td>
      </tr>
      <tr>
        <td>Gender:</td>
        <td>
          <input type="radio" name="gender" value="male"> Male
          <input type="radio" name="gender" value="female"> Female
        </td>
      </tr>
      <tr>
        <td>Hobbies:</td>
        <td>
          <input type="checkbox" name="hobby" value="reading"> Reading
          <input type="checkbox" name="hobby" value="sports"> Sports
          <input type="checkbox" name="hobby" value="music"> Music
        </td>
      </tr>
      <tr>
        <td>Course:</td>
        <td>
          <select name="course">
            <option>BCA</option>
            <option>B.Tech</option>
            <option>MCA</option>
            <option>M.Tech</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>Section:</td>
        <td>
          <input type="radio" id="13" name="cse13">CSE13
          <input type="radio" id="14" name="cse14">CSE14
        </td>
      </tr>
      <tr>
        <td>Address:</td>
        <td><textarea name="address" rows="4" cols="30"></textarea></td>
      </tr>
      <tr>
        <td colspan="2" align="center">
          <input type="submit" value="Register">
          <input type="reset" value="Reset">
        </td>
      </tr>
    </table>
  </form>
  <iframe
  id="inlineFrameExample"
  title="Inline Frame Example"
  width="320"
  height="240"
  src="10thMarksheet.jpg">
  </iframe>

</body>
</html>
